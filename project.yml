# XcodeGen 项目描述。生成 Xcode 工程：
#   brew install xcodegen
#   xcodegen generate
#   open KongGlean.xcodeproj
name: KongGlean

options:
  bundleIdPrefix: com.kongxiangrui
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 在 Xcode 的 Signing & Capabilities 里选自己的 Team

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  KongGleanCore:
    path: Packages/KongGleanCore

targets:
  KongGlean:
    type: application
    platform: macOS
    sources:
      - path: KongGlean
    dependencies:
      - package: GRDB
      - package: KongGleanCore
    info:
      path: KongGlean/Info.plist
      properties:
        CFBundleDisplayName: KongGlean
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 孔祥瑞"
        CFBundleURLTypes:
          - CFBundleURLName: com.kongxiangrui.KongGlean
            CFBundleURLSchemes: [kongglean]
    entitlements:
      path: KongGlean/KongGlean.entitlements
      properties:
        # 个人自用，不开沙盒：与 DMG 版（Tools/build-dmg.sh）共用同一个数据目录
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongxiangrui.KongGlean
        PRODUCT_NAME: KongGlean
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES

  KongGleanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KongGleanTests
    dependencies:
      - target: KongGlean
      # 测试包由 App 作宿主，包已链接进 App，这里只需可见、不重复链接
      - package: GRDB
        link: false
      - package: KongGleanCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongxiangrui.KongGleanTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KongGlean:
    build:
      targets:
        KongGlean: all
        KongGleanTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KongGleanTests
    archive:
      config: Release
