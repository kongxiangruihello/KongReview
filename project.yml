# XcodeGen 项目描述。生成 Xcode 工程：
#   brew install xcodegen
#   xcodegen generate
#   open KongReview.xcodeproj
name: KongReview

options:
  bundleIdPrefix: com.kongxiangrui
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "6.0.6"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 在 Xcode 的 Signing & Capabilities 里选自己的 Team

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  KongReviewCore:
    path: Packages/KongReviewCore

targets:
  KongReview:
    type: application
    platform: macOS
    sources:
      - path: KongReview
    dependencies:
      - package: GRDB
      - package: KongReviewCore
    info:
      path: KongReview/Info.plist
      properties:
        CFBundleDisplayName: KongReview
        CFBundleDevelopmentRegion: zh-Hans
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 孔祥瑞"
        CFBundleURLTypes:
          - CFBundleURLName: com.kongxiangrui.KongReview
            CFBundleURLSchemes: [kongreview, kongglean]   # kongglean：改名前的旧链接
        NSAppleEventsUsageDescription: 从浏览器录入摘录时读取当前标签页的网址，自动填入出处。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true    # 网页存档里有不少 http 图片
        NSServices:                       # 1.3：系统“服务”菜单（与 Tools/build-dmg.sh 保持一致）
          - NSMenuItem: { default: 添加到 KongReview }
            NSMessage: addHighlight
            NSPortName: KongReview
            NSSendTypes: [public.html, public.rtf, public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    entitlements:
      path: KongReview/KongReview.entitlements
      properties:
        # 个人自用，不开沙盒：与 DMG 版（Tools/build-dmg.sh）共用同一个数据目录
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true   # 读取浏览器当前网址（开启 Hardened Runtime 时需要）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongxiangrui.KongReview
        PRODUCT_NAME: KongReview
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES

  KongReviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KongReviewTests
    dependencies:
      - target: KongReview
      # 测试包由 App 作宿主，包已链接进 App，这里只需可见、不重复链接
      - package: GRDB
        link: false
      - package: KongReviewCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kongxiangrui.KongReviewTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KongReview:
    build:
      targets:
        KongReview: all
        KongReviewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KongReviewTests
    archive:
      config: Release
